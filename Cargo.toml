[package]
name = "meow-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Git, without the growl. A beginner-first Git CLI."
license = "MIT"
repository = "https://github.com/Abhinav-Prabhakar/Meow"
readme = "README.md"
keywords = ["git", "cli", "beginner", "vcs"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "meow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.15"
dialoguer = "0.11"
dirs = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
